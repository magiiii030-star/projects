<html>
    <head>
        <title> document manipulation </title>
    </head>
    <body>
        <p id="paragraph">hiiii</p>
        <script>
            let p1=document.getElementById( "paragraph" ).innerText='krishna';
            console.log(p1)

            var p2=document.getElementById("paragraph").innerHTML='<h1>hello </h1>';
            console.log(p2)

            var p3=document.getElementById("paragraph").style.backgroundColor="red"
            console.log(p3)

            var p4=document.getElementById("paragraph").style.width="200px"
            console.log(p4)

            var p5=document.getElementById("paragraph").style.height="100px"
            console.log(p5)

            var p6=document.getElementById("paragraph").style.textAlign="200px"
            console.log(p6)

            var p7=document.getElementById("paragraph").style.padding="200px"
            console.log(p7)

            var p8=document.getElementById("paragraph").style.border="30px  blue "
            console.log(p8)



             
            
        








            



        </script>

    </body>
</html>
