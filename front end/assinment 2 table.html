<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Table</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f8f9fa;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .timetable-container {
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  }

  h1 {
    text-align: center;
    margin-bottom: 20px;
    color: #333;
  }

  table {
    border-collapse: collapse;
    width: 100%;
    max-width: 700px;
    text-align: center;
  }

  th, td {
    border: 2px solid #333;
    padding: 15px;
    font-size: 16px;
    min-width: 80px;
  }

  thead th {
    background: #4f46e5;
    color: white;
    font-weight: bold;
  }

  .time-col {
    background: #e0e7ff;
    font-weight: bold;
  }


  .holiday {
    background: #fef08a;
    font-weight: bold;
    color: #92400e;
    font-size: 18px;
  }

  td:empty {
    background: #f9fafb;
  }
  
</style>
</head>
<body>

<div class="timetable-container">
  <h1> Time Table</h1>
  
  <table>
    <thead>
      <tr>
        <th>Days</th>
        <th>10 - 11</th>
        <th>11 - 12</th>
        <th>12 - 1</th>
        <th>1 - 2</th>
        <th>2 - 3</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td class="time-col">Mon</td>
        <td> </td>
        <td></td>
        <td>l</td>
        <td></td>
        <td></td>
      </tr>
      <tr>
        <td class="time-col">Tue</td>
        <td></td>
        <td></td>
        <td>u</td>
        <td></td>
        <td></td>
      </tr>
      <tr>
        <td class="time-col">Wed</td>
        <td></td>
        <td></td>
        <td>n</td>
        <td></td>
        <td></td>
      </tr>
      <tr>
        <td class="time-col">Thu</td>
        <td></td>
        <td></td>
        <td>c</td>
        <td></td>
        <td></td>
      </tr>
      <tr>
        <td class="time-col">Fri</td>
        <td></td>
        <td></td>
        <td>h</td>
        <td></td>
        <td></td>
      </tr>


      <tr>
        <td class="time-col">Sat</td>
        <td colspan="5" class="holiday">holiday</td>
      </tr>
    </tbody>
  </table>
</div>

</body>
</html>
