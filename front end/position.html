<html>
    <head>
        <title> position</title>
        <style>
            h1{  position: static;
                background-attachment: blue;
                padding: 10px;

            }
            h2{ position: relative;
                top: 20px;
                left: 10px;
                background-color: red;
                padding: 10px;

            }
            h3{
                position: absolute;
                top: 0px;
                righ: 30px;

            }

            div{
                border: 500px;
            }

            


        </style>
    </head>
    <body>
        <div> this is h3 tag </div>
        <h3> this is fixed</h3>
        <h1> this is static </h1>
        <h2> this is  relative </h2>
    </body>
</html>
