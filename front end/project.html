

      <html>
        <head>
              <title>Mobile OTP Login</title>

     <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: red;
        }

        .login-box {
            width: 350px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }

        h2 {
            margin-bottom: 10px;
            color: #333;
        }

        p {
            color: #777;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #5568d9;
        }

        #otpSection {
            display: none;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>Mobile Login</h2>
        <p>Enter your mobile number</p>

        <div id="mobileSection">
            <input
                type="tel"
                id="mobile"
                placeholder="Enter mobile number"
                maxlength="10"
            >

            <button  onclick="sendOTP()">Send OTP</button>
        </div>


        <div id="otpSection">
            <input
                type="text"
                id="otp"
                placeholder="Enter 6-digit OTP"
                maxlength="6"
            >

            <button onclick="verifyOTP()">Verify OTP</button>
        </div>

        <div id="message"></div>

    </div>

    <script>
        let generatedOTP;

        function sendOTP() {

            let mobile = document.getElementById("mobile").value;
            let message = document.getElementById("message");

            if (mobile.length !== 10 || isNaN(mobile)) {
                message.style.color = "red";
                message.innerText = "Please enter a valid 10-digit mobile number.";
                return;
            }

            // Generate 6-digit OTP
            generatedOTP = Math.floor(100000 + Math.random() * 900000);

            console.log("Demo OTP:", generatedOTP);

            message.style.color = "green";
            message.innerText = "OTP sent successfully!";

            document.getElementById("mobileSection").style.display = "none";
            document.getElementById("otpSection").style.display = "block";
        }

        function verifyOTP() {

            let enteredOTP = document.getElementById("otp").value;
            let message = document.getElementById("message");

            if (enteredOTP == generatedOTP) {

                message.style.color = "green";
                message.innerText = "Login successful! ";

            } else {

                message.style.color = "red";
                message.innerText = "Invalid OTP. Please try again.";

            }
        }
    </script>

</body>
</html>
