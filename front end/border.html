<html>
    <head>
        <title> border   </title>
        <style>
            h1{
                border:solid;
            }
            h2{ border:double;

            }
            h3{
                border:dotted;
            }
            h4{
                border:dashed;
            }
            h5{
                border:ridge;
            }
            h6{
                border:groove;
            }
            p{
                border:inset;
            }
            #x{
                border:outset;
            }
            #y{
                border:hidden;
            }
            #z{
                border:none;
            }

        </style>

    </head>
    <body>
        <h1> this is h1 tag solid </h1>
        <h2> this is h2 tag double  </h2>
        <h3> this is h3  tag dotted </h3>
        <h4> this is  h4 tag dashed </h4>
        <h5> this is h5 tag ridge </h5>
        <h6> this is h6 tag groove</h6> 
        <p > para tag inset </p>
        <p id="x" >para tag out set </p>
        <p id="y"> para tag  hidden</p>
        <p id="z"> para tag none </p>

    </body>
</html>
